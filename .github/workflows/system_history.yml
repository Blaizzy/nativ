name: Local hardware history

on:
  pull_request:
    paths:
      - "Sources/Nativ/Features/SystemMonitor/**"
      - "Sources/Nativ/Features/ControlPanel/ControlPanelDependencies.swift"
      - "scripts/tests/*SystemTelemetry*"
      - "scripts/tests/test_system_history.py"
      - ".github/workflows/system_history.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Run focused regression tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_system_history.py' -v
