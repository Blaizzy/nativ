name: Dev Build

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    env:
      XCODE_DERIVED_DATA: build/NativDevelopmentDerivedData
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Metal Toolchain for the terminal renderer
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Test release metadata and preview feeds
        run: python3 -m unittest discover -s scripts/tests -p 'test_macos_release.py'

      - name: Test request diagnostics
        run: python3 -m unittest discover -s scripts/tests -p 'test_request_diagnostics*.py' -v

      - name: Test runtime build and model capability detection
        run: python3 -m unittest scripts.tests.test_python_resource_reuse scripts.tests.test_model_capabilities -v

      - name: Cache bundled mlx-vlm server distribution
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.XCODE_DERIVED_DATA }}/Build/Products/Debug/NativServerKit.framework/Versions/A/Resources/mlx-vlm-server
            .cache/python-build-standalone
          key: mlx-vlm-server-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('PythonDistribution/**') }}

      - name: Cache Swift package dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.XCODE_DERIVED_DATA }}/SourcePackages
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Nativ.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-

      - name: Build app and run targeted regression tests (unsigned Debug)
        run: |
          make xcode-generate
          xcodebuild -project Nativ.xcodeproj -scheme Nativ -configuration Debug \
            -derivedDataPath "$XCODE_DERIVED_DATA" -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO NATIV_PRODUCT_NAME=Nativ COMPILER_INDEX_STORE_ENABLE=NO \
            -only-testing:NativTests/SoftwareUpdaterTests \
            -only-testing:NativTests/MCPClientTests \
            -only-testing:NativTests/MCPProjectFilesystemTests \
            -only-testing:NativTests/MCPFilesystemSafetyTests \
            -only-testing:NativTests/MCPServerCatalogTests \
            -only-testing:NativTests/ChatProjectStoreTests \
            -only-testing:NativTests/ChatCompactionTests \
            -only-testing:NativTests/ChatFileWriteToolTests \
            -only-testing:NativTests/ChatReadFileToolTests \
            -only-testing:NativTests/AudioAnalyticsStoreTests \
            -only-testing:NativTests/AudioPlaybackStateTests \
            -only-testing:NativTests/NativAudioClientTests \
            -only-testing:NativTests/AudioDiarizationTests \
            -only-testing:NativTests/AudioDiarizationStorageTests \
            -only-testing:NativTests/AudioSpeakerProfileTests \
            -only-testing:NativTests/AudioLibraryFilterTests \
            -only-testing:NativTests/AudioRecordExportTests \
            -only-testing:NativTests/AudioSummaryReferenceTests \
            -only-testing:NativTests/AudioSummaryDocumentTests \
            -only-testing:NativTests/MarkdownParserTests \
            -only-testing:NativTests/MarkdownGeometryTests \
            -only-testing:NativTests/MarkdownSelectionTests \
            -only-testing:NativTests/ModelPrimaryTaskResolverTests \
            -only-testing:NativTests/LocalModelDiscoveryTests \
            -only-testing:NativTests/HuggingFaceModelSupportTests \
            -only-testing:NativTests/MLXImageModelResolverTests \
            -only-testing:NativTests/NativModelTypeRegistryDrafterTests \
            -only-testing:NativTests/ChatResponseSpeechTests \
            -only-testing:NativTests/NativAudioSpeechClientTests \
            -only-testing:NativTests/HuggingFaceCapabilityFilterTests \
            -only-testing:NativTests/SystemTelemetryTests \
            -only-testing:NativTests/SystemMonitorIdentityTests \
            -only-testing:NativTests/SystemMonitorObservationPolicyTests test
