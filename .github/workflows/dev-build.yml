name: Dev Build

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test release metadata and preview feeds
        run: python3 -m unittest discover -s scripts/tests -p 'test_macos_release.py'

      - name: Cache bundled mlx-vlm server distribution
        uses: actions/cache@v4
        with:
          path: |
            dist/mlx-vlm-server
            .cache/python-build-standalone
          key: mlx-vlm-server-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('PythonDistribution/**') }}

      - name: Cache Swift package dependencies
        uses: actions/cache@v4
        with:
          path: build/XcodeDerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}

      - name: Build app (unsigned Debug)
        run: make xcode-build

      - name: Test software update channels
        run: |
          xcodebuild -project Nativ.xcodeproj -scheme Nativ -configuration Debug \
            -derivedDataPath build/NativDevelopmentDerivedData \
            CODE_SIGNING_ALLOWED=NO NATIV_SKIP_PYTHON_RESOURCE_BUILD=YES \
            -only-testing:NativTests/SoftwareUpdaterTests test
